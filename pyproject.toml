[project]
name = "marketplace-alert"
version = "0.1.0"
description = "Scalable marketplace monitoring and alert platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketplace_alert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

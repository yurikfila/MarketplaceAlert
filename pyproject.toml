[project]
name = "marketplace-alert"
version = "0.1.0"
description = "Scalable marketplace monitoring and alert platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4's bcrypt backend self-test breaks against bcrypt>=4.1
    # (bcrypt dropped the `__about__.__version__` attribute passlib probes
    # to pick its code path - verified directly: bcrypt 5.0 raises
    # ValueError on the very first hash attempt). Pinned below 4.1 until
    # passlib itself is upgraded past this - see
    # https://github.com/pyca/bcrypt/issues/684.
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketplace_alert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
